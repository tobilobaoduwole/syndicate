class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidUpdate(prev){ if(prev.resetKey!==this.props.resetKey && this.state.err) this.setState({err:null}); }
  render(){ if(this.state.err) return (
    <div className="max-w-lg mx-auto card p-6 text-center">
      <div className="text-3xl mb-2">⚠️</div>
      <h3 className="gold font-bold mb-1">This screen hit a problem</h3>
      <p className="text-xs text-[#b9b3a3] mb-3">Your data is safe. Try another tab, or reload the page.</p>
      <p className="text-[10px] text-[#5f5b52] break-words">{String(this.state.err&&this.state.err.message||this.state.err)}</p>
      <div className="mt-4"><Btn onClick={()=>location.reload()}>Reload</Btn></div>
    </div>); return this.props.children; }
}
function computeLeaders(state){
  const leaders={}; const tc=state.settings.teamCount||4;
  for(let t=0;t<tc;t++){
    const members=state.players.filter(p=>p.team===t && p.rsvp==="yes");
    if(!members.length){leaders[t]=null;continue;}
    const stored=state.teamLeaders?state.teamLeaders[t]:null;
    const ousters=members.filter(m=>m.oustVote).length; const majority=Math.floor(members.length/2)+1;
    const tally={}; members.forEach(m=>{if(m.leaderVote)tally[m.leaderVote]=(tally[m.leaderVote]||0)+1;});
    let best=null,bestN=-1;
    members.forEach(m=>{const v=tally[m.id]||0; if(stored===m.id&&ousters>=majority)return;
      if(v>bestN||(v===bestN&&best&&m.playerNumber<best.playerNumber)){best=m;bestN=v;}});
    leaders[t]=best?best.id:null;
  }
  return leaders;
}

function RSVP({state,update,logAudit,rememberCode}){
  const s=state.settings;

  const full=confirmed>=s.capacity;
  const blank={fullName:"",displayName:"",phone:"",email:"",house:false,fair:false};

  const [modal,setModal]=useState(null);
  const set=(k,v)=>setF(x=>({...x,[k]:v}));
  const sendEmail=(name,dn,email,code)=>{
    if(!email){setNote("No email given — share the entry code manually.");return;}
    const link=location.origin+location.pathname+"?code="+encodeURIComponent(code);
    if(!window.emailjs||EMAILJS.publicKey.indexOf("YOUR_")===0){setNote("Email service not configured — entry code shown below.");return;}
    emailjs.send(EMAILJS.serviceId,EMAILJS.templateId,{to_email:email,to_name:name,display_name:dn,entry_code:code,portal_link:link,event_name:s.eventName,event_time:s.timeLabel,dress_code:s.dressCode})
      .then(()=>setNote("✔ Confirmation email sent to "+email))
      .catch(()=>setNote("Email failed — share the entry code manually."));
  };
  const submit=()=>{
    if(!f.fullName.trim()||!f.phone.trim()){setErr("Full name and phone are required.");return;}
    if(!f.email.trim()){setErr("Email is required — your entry code is sent there.");return;}
    if(!f.house||!f.fair){setErr("Please read and accept the house rules and fair-play rules.");return;}
    const ek=f.email.trim().toLowerCase();
    if(state.players.find(p=>(p.email||"").trim().toLowerCase()===ek)){setErr("This email has already been used to register.");return;}
    if(f.phone.trim()&&state.players.find(p=>p.phone===f.phone.trim())){setErr("This phone number has already registered.");return;}
    const status=full?"waitlist":"yes";
    const id=uid("SYN");
    const dn=f.displayName.trim()||f.fullName.trim().split(" ")[0];
    update(n=>{
      n.players.push({id,fullName:f.fullName.trim(),displayName:dn,phone:f.phone.trim(),email:f.email.trim(),
        rsvp:status,checkedIn:false,team:null,playerNumber:null,ip:0,tokens:5,status:"active",
        missionNo:null,missionTier:0,leaderVote:null,oustVote:false,committee:false,photoConsent:true,notes:"",sample:false});
      logAudit(n,"RSVP","New registration",f.fullName.trim(),"—",status,"self form");
    });
    sendEmail(f.fullName.trim(),dn,f.email.trim(),id);
    if(rememberCode) rememberCode(id);
    setDone({id,status}); setF(blank); setErr("");
  };
  if(done) return (
    <div className="max-w-lg mx-auto card p-8 glow text-center">
      <div className="text-5xl mb-2">{done.status==="waitlist"?"⏳":"♦"}</div>

      <p className="text-sm text-[#c9c3b2] mb-4">{done.status==="yes"?"Welcome to the Syndicate. A confirmation email with your entry code and portal link is on its way.":"We're at capacity. You'll be promoted automatically if a seat opens."}</p>
      <div className="card p-4 inline-block"><div className="text-[10px] text-[#8a8578]">YOUR ENTRY CODE</div>
        <div className="gold text-2xl font-mono tracking-widest">{done.id}</div><QRlike text={done.id}/></div>
      {note && <div className="text-xs text-[#b9b3a3] mt-3">{note}</div>}
      <div className="mt-5"><Btn tone="ghost" onClick={()=>{setDone(null);setNote("");}}>Register another</Btn></div>
    </div>);
  return (<div className="max-w-lg mx-auto">
    <div className="card p-4 mb-4 flex items-center justify-between">
      <div><span className="gold font-bold">RSVP · {s.eventName}</span>
        <div className="text-xs text-[#8a8578]">Capacity {confirmed}/{s.capacity} · {full?"WAITLIST OPEN":"seats available"}</div></div>
      <div className="w-28 h-2 bg-[#2a2a2e] rounded"><div className="h-2 bg-gold rounded" style={{width:`${Math.min(100,confirmed/s.capacity*100)}%`}}/></div></div>
    <div className="card p-6">

      <Field label="Preferred display name"><input className={inputCls} value={f.displayName} onChange={e=>set("displayName",e.target.value)} placeholder="How you'll appear on the scoreboard"/></Field>
      <Field label="Phone number *"><input className={inputCls} value={f.phone} onChange={e=>set("phone",e.target.value)}/></Field>
      <Field label="Email * (your entry code is sent here)"><input className={inputCls} value={f.email} onChange={e=>set("email",e.target.value)}/></Field>
      <div className="mt-1 space-y-2 text-sm">

      <p className="text-[10px] text-[#5f5b52] mt-3">Your details are visible only to the organiser, never to other guests.</p>
    </div>
    {modal && <RulesModal kind={modal} onClose={()=>setModal(null)} onAgree={()=>{ set(modal,true); setModal(null); }}/>}
  </div>);

function QRlike({text,size=104}){
  const cells=13; const grid=useMemo(()=>{let h=0;for(let i=0;i<text.length;i++)h=(h*31+text.charCodeAt(i))>>>0;const arr=[];let x=h||1;for(let i=0;i<cells*cells;i++){x=(x*1103515245+12345)&0x7fffffff;arr.push((x>>7)&1);}return arr;},[text]);
  return (<div className="mx-auto mt-2 bg-white p-2 rounded" style={{width:size+16}}><div className="grid" style={{gridTemplateColumns:`repeat(${cells},1fr)`,width:size,height:size}}>{grid.map((c,i)=><div key={i} style={{background:c?"#000":"#fff"}}/>)}</div></div>);
}

function BigTimer({state,update}){
  const [min,setMin]=useState(5); const [now,setNow]=useState(Date.now());
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),250);return()=>clearInterval(t)},[]);
  const timerEnd=state.settings.timerEnd, timerLeft=state.settings.timerLeft;
  const running = !!timerEnd;
  const left = running ? Math.max(0,timerEnd-now) : (timerLeft||0);
  const mm=Math.floor(left/6e4), ss=Math.floor(left/1e3)%60;
  const start=(m)=>update(n=>{n.settings.timerEnd=Date.now()+ (m!=null?m:min)*6e4; n.settings.timerLeft=null;});
  const pause=()=>update(n=>{ if(n.settings.timerEnd){ n.settings.timerLeft=Math.max(0,n.settings.timerEnd-Date.now()); n.settings.timerEnd=null; }});
  const resume=()=>update(n=>{ if(n.settings.timerLeft){ n.settings.timerEnd=Date.now()+n.settings.timerLeft; n.settings.timerLeft=null; }});
  const stop=()=>update(n=>{n.settings.timerEnd=null;n.settings.timerLeft=null;});
  const paused = !running && (timerLeft||0)>0;
  return (<div className="text-center">
    <div className={`text-6xl font-black font-mono ${left<=10000&&running?'text-red-400':'gold'}`}>{String(mm).padStart(2,"0")}:{String(ss).padStart(2,"0")}</div>
    <div className="text-[10px] text-[#8a8578] mb-3">{running?"running":paused?"paused — press resume to continue":"stopped"}</div>
    <div className="flex justify-center items-center gap-2 flex-wrap">
      {!running && !paused && (<><input type="number" className={inputCls+" w-20"} value={min} onChange={e=>setMin(Number(e.target.value))}/>{[3,5,10].map(x=><Btn key={x} tone="ghost" onClick={()=>start(x)}>{x}m</Btn>)}<Btn onClick={()=>start()}>▶ Start</Btn></>)}
      {running && <Btn tone="dark" onClick={pause}>⏸ Pause</Btn>}
      {paused && <Btn onClick={resume}>▶ Resume</Btn>}
      {(running||paused) && <Btn tone="danger" onClick={stop}>■ Reset</Btn>}
    </div>
  </div>);
}

  return (<div className={projector?"fixed inset-0 bg-black z-50 overflow-auto p-8":""}>
    <div className="flex justify-between items-center mb-4 flex-wrap gap-2"><div><h2 className="gold text-2xl font-black tracking-wider">LIVE STANDINGS</h2><div className="text-xs text-[#8a8578]">Round: {ROUND_FLOW[s.roundIndex]||"Registration"} {suspense&&"· 🔒 SUSPENSE"}</div></div><div className="flex gap-2"><Btn tone="dark" onClick={()=>update(n=>n.settings.suspense=!n.settings.suspense)}>{suspense?"Show totals":"Suspense mode"}</Btn><Btn tone="ghost" onClick={()=>setProjector(!projector)}>{projector?"Exit projector":"📺 Projector"}</Btn><Btn onClick={()=>update(n=>n.settings.revealWinner=true)}>👑 Reveal Chair</Btn></div></div>
    <div className="grid md:grid-cols-2 gap-4"><div className="card p-5"><h3 className="gold font-bold mb-3">🏛️ Houses</h3>{teams.map((h,i)=>(<div key={h.idx} className="flex items-center gap-3 py-2 border-b border-[#2a2a2e]"><div className="w-6 text-center font-bold gold">{i+1}</div><div className="w-3 h-6 rounded" style={{background:h.ring}}/><div className="flex-1">{h.name}<div className="text-[10px] text-[#8a8578]">{h.members} members {leaders[h.idx]&&"· leader 👑"}</div></div><div className="gold font-bold text-lg">{suspense?"•••":h.total}</div></div>))}</div>
      <div className="card p-5"><h3 className="gold font-bold mb-3">🎯 Individuals (top 12)</h3>{indiv.length===0?<p className="text-xs text-[#8a8578]">No players yet.</p>:indiv.slice(0,12).map((p,i)=>(<div key={p.id} className="flex items-center gap-3 py-1.5 border-b border-[#2a2a2e]"><div className="w-6 text-center font-bold gold">{i+1}</div><div className="flex-1 text-sm">{p.displayName}<span className="ml-1 text-[10px]">{p.status==="frozen"?"❄️":p.status==="qualified"?"✅":p.status==="finalist"?"⭐":""}</span></div><div className="text-xs text-[#8a8578]">{p.tokens}⚑</div><div className="gold font-bold">{suspense?"•••":p.ip}</div></div>))}</div></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
